services:

  # =============================================
  # ZONA PUBLICA - Servidor Web (DMZ)
  # =============================================
  web-servidor:
    image: nginx:alpine
    container_name: securecorp-web
    ports:
      - "8080:80"
    volumes:
      - ./fase1/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./fase1/html:/usr/share/nginx/html:ro
    networks:
      red-publica:
        ipv4_address: 172.28.0.10
      red-interna:
        ipv4_address: 172.29.0.10

  # =============================================
  # ZONA PUBLICA - Servidor Web BASTIONADO
  # =============================================
  web-bastionado:
    image: nginx:alpine
    container_name: securecorp-bastionado
    ports:
      - "8086:80"
    volumes:
      - ./fase2/nginx-bastionado.conf:/etc/nginx/conf.d/default.conf:ro
      - ./fase2/html:/usr/share/nginx/html:ro
    networks:
      red-publica:
        ipv4_address: 172.28.0.20

  # =============================================
  # ZONA PUBLICA - Servidor Web con DEFENSA ACTIVA
  # =============================================
  web-defensa:
    image: nginx:alpine
    container_name: securecorp-defensa
    ports:
      - "8090:80"
    volumes:
      - ./fase4/nginx-defensa.conf:/etc/nginx/nginx.conf:ro
      - ./fase4/html:/usr/share/nginx/html:ro
    networks:
      red-publica:
        ipv4_address: 172.28.0.30

  # =============================================
  # ZONA INTERNA - Aplicacion Vulnerable (Juice Shop)
  # =============================================
  app-vulnerable:
    image: bkimminich/juice-shop
    container_name: securecorp-juiceshop
    ports:
      - "3000:3000"
    networks:
      red-interna:
        ipv4_address: 172.29.0.20

  # =============================================
  # ZONA DE ATAQUE - Contenedor Atacante
  # =============================================
  atacante:
    image: alpine:latest
    container_name: securecorp-atacante
    stdin_open: true
    tty: true
    command: sh -c "apk add --no-cache apache2-utils curl && sh"
    networks:
      red-publica:
        ipv4_address: 172.28.0.100

  # =============================================
  # IMAGEN VULNERABLE PARA PIPELINE CI/CD
  # =============================================
  app-insegura:
    build:
      context: ./fase2
      dockerfile: Dockerfile.vulnerable
    container_name: securecorp-insegura
    profiles:
      - ci-test

# =============================================
# REDES - Segmentacion por Zonas (VLANs logicas)
# =============================================
networks:
  red-publica:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/24
          gateway: 172.28.0.1

  red-interna:
    driver: bridge
    ipam:
      config:
        - subnet: 172.29.0.0/24
          gateway: 172.29.0.1
