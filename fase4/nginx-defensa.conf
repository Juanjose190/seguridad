worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # --- DEFENSA: Ocultar version ---
    server_tokens off;

    # ============================================================
    # RATE LIMITING (Semana 10 - Defensa Activa contra DoS)
    # ============================================================
    # Limita a 10 peticiones por segundo por IP
    # Zone: 10MB de memoria compartida para rastrear IPs
    limit_req_zone $binary_remote_addr zone=anti_dos:10m rate=10r/s;

    # Respuesta personalizada cuando se excede el limite
    limit_req_status 503;

    server {
        listen 80;
        server_name localhost;

        # --- Cabeceras de Seguridad (Bastionado completo) ---
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline'" always;

        location / {
            # Aplicar Rate Limiting: burst=10 permite rafagas cortas
            # nodelay: responder inmediatamente hasta el burst
            limit_req zone=anti_dos burst=10 nodelay;

            root   /usr/share/nginx/html;
            index  index.html;
        }

        # Pagina de error personalizada para peticiones limitadas
        error_page 503 /503.html;
        location = /503.html {
            root /usr/share/nginx/html;
            internal;
        }
    }
}
