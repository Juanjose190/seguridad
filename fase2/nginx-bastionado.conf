server {
    listen 80;
    server_name localhost;

    # --- BASTIONADO: Ocultar version de Nginx (Semana 5) ---
    # Antes: Server: nginx/1.25.3  |  Despues: Server: nginx
    # Mitiga: Banner Grabbing / Reconocimiento automatizado
    server_tokens off;

    # --- BASTIONADO: Proteccion contra Clickjacking (OWASP) ---
    # Impide que sitios externos incrusten esta web en un <iframe>
    add_header X-Frame-Options "SAMEORIGIN" always;

    # --- BASTIONADO: Proteccion contra MIME-Sniffing (OWASP) ---
    # Obliga al navegador a respetar el Content-Type declarado
    add_header X-Content-Type-Options "nosniff" always;

    # --- BASTIONADO: Proteccion XSS basica ---
    add_header X-XSS-Protection "1; mode=block" always;

    # --- BASTIONADO: Politica de referencia ---
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location / {
        root   /usr/share/nginx/html;
        index  index.html;
    }
}
